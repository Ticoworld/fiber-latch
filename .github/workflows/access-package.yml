name: access-package

on:
  push:
    paths:
      - "packages/access/**"
      - "packages/postgres-store/**"
      - "examples/paid-resource/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/access-package.yml"
  pull_request:
    # Required checks must run even for documentation-only PRs.
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run backend tests
        run: npm test

      - name: Run backend build
        run: npm run build

      - name: Verify access package
        run: npm run verify:access:package

      - name: Verify paid-resource example
        run: npm run verify:access:example

      - name: Typecheck and build PostgreSQL store
        run: |
          npm run check --workspace @fiberlatch/postgres-store
          npm run build --workspace @fiberlatch/postgres-store

      - name: Verify PostgreSQL store distribution
        run: npm test --workspace @fiberlatch/postgres-store

      - name: Check PostgreSQL store package metadata and types
        run: |
          node packages/access/node_modules/publint/src/cli.js run --strict packages/postgres-store
          npx --no-install attw --pack packages/postgres-store --profile esm-only --entrypoints .
